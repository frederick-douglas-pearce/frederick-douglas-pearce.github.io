# Corrects the language a repo card shows when GitHub's detected one misdescribes
# the work, keyed by the same owner/name as github_repos. Repos not listed show
# GitHub's language. The card's dot takes the displayed language's color from
# language_colors in repository_stats.json and is left out when there is none;
# until #122 lands, bin/repo-stats.js does not read this map, so pick a language
# that file already colors.
repo_language_overrides:
