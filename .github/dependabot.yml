version: 2

# Dependencies are pinned exactly so CI behaviour cannot change without a
# commit. Dependabot is what keeps that from going stale: upgrades arrive as
# reviewable PRs instead of silently at run time.
#
# Monthly and grouped, deliberately. A prettier bump usually lands as a failing
# PR that needs a reformat commit, so these are chores to be batched, not
# notifications to be chased.
updates:
  # prettier + @shopify/prettier-plugin-liquid, consumed by prettier.yml via
  # npm ci. A bump may require reformatting; the PR's own Prettier check says so.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"

  # Action versions in .github/workflows/. Covers tags and SHA pins that carry
  # a trailing version comment; it cannot bump a branch ref such as @main, so
  # actions here should be pinned to a tag or a commented SHA to stay tracked.
  # Does not cover tools installed inside run: steps.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Ruby gems in Gemfile / Gemfile.lock. CI installs them in deploy.yml and
  # broken-links-site.yml, and the local build recipe in CLAUDE.md installs
  # this lockfile into a vendor dir. Only the gems preinstalled in the
  # amirpourmand/al-folio image are separate, and they are not covered here.
  #
  # lockfile-only: the Gemfile is human-owned. Its >= floors record security
  # minimums, and css_parser's ~> pin is explained at its Gemfile line.
  # In-range updates come with the monthly grouped PR, or sooner as individual
  # security PRs when Dependabot security updates are enabled in the repo
  # settings. A fix outside a Gemfile requirement is never auto-PR'd; it
  # surfaces as an alert to handle by hand.
  #
  # Dependabot resolves on its own Ruby and Bundler, so check its PRs the way
  # PR #154 did: BUNDLED WITH and PLATFORMS unchanged, every platform-specific
  # nokogiri entry present. CI builds on Ruby 3.3, but until its bundle install
  # is frozen (#153) a gem that needs a newer Ruby may be re-resolved rather
  # than fail, so read the PR build's "Install dependencies" log for Resolving
  # lines or versions that differ from the lockfile.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    # jekyll-terser comes from a third-party git repo (RobertoJBeltran/
    # jekyll-terser, inherited from upstream al-folio; :git with no ref) and
    # minifies the JS the site ships. Moving its locked revision is a
    # deliberate commit, not one line in a grouped monthly PR.
    ignore:
      - dependency-name: jekyll-terser
    groups:
      bundler:
        patterns:
          - "*"
