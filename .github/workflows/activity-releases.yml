name: Refresh activity releases

# Daily refresh of _data/activity.json, the GitHub Releases in the Activity
# stream (#73). The work, including why the deploy is dispatched explicitly
# instead of left to deploy.yml's _data/** path filter, is in
# bin/activity-releases-refresh.sh.

on:
  schedule:
    # Daily 05:43 UTC, well clear of the daily ESG deploy, which follows the
    # ESG push at 07:01 Pacific (14:01 UTC in summer, 15:01 UTC in winter). A
    # refresh with changes dispatches deploy.yml, whose deploy job holds the
    # "pages" concurrency group for up to its 26-min cap after a build of up to
    # 20 min. Starting 8¼-9¼ hours earlier leaves room for GitHub starting a
    # scheduled run late under load. It is also clear of repo-stats.yml's
    # Monday 03:17 UTC run, whose job and deploy finish by about 04:23. A manual
    # run can still collide: avoid dispatching one in the ~46 min before the
    # ESG push. The odd minute avoids top-of-the-hour schedule congestion.
    - cron: "43 5 * * *"
  # Pull a new release on demand, re-run after a transient failure, and keep
  # the refresh alive if GitHub ever disables the schedule.
  workflow_dispatch:

# Least privilege at the top: this block replaces the repo default (write) for
# any job without its own. A job's block replaces this one rather than adding
# to it, so the refresh job's list below must name everything it needs.
permissions:
  contents: read

jobs:
  refresh:
    # Skip a dispatch against any branch but main, so an unmodified copy of
    # this file on a feature branch cannot push to main by accident. A branch
    # that edits this line still runs as written: it guards against mistakes
    # and is not a security boundary.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # bin/activity-releases.js makes at most RELEASE_REPOS.length x PAGE_CAP
    # sequential requests (3 x 3 = 9), each up to ~48s in the worst case (3 x
    # 15s timeout + 1s + 2s backoff), so ~7.2 min before it can exit 75 and
    # name what failed, plus up to 40s of dispatch backoff and setup. Recompute
    # if RELEASE_REPOS or PAGE_CAP changes.
    timeout-minutes: 15
    permissions:
      contents: write # push the regenerated data file
      actions: write # dispatch deploy.yml
    concurrency:
      group: activity-releases-refresh
      cancel-in-progress: false
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          # Load-bearing: a re-run of a scheduled run would otherwise check out
          # the original commit, and a push rejected because main moved would be
          # rejected again.
          ref: main
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Refresh, check, commit and deploy 🔄
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: bin/activity-releases-refresh.sh
