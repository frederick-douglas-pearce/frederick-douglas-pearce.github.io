name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_data/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!.claude/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_data/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!.claude/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:
    inputs:
      # Set by the redeploy job below (bin/pages-redeploy.sh), and by hand
      # only for the drill. A run started with it never runs redeploy again,
      # so a hang that survives the new commit fails red once instead of
      # looping. Unless it is a drill, its report job comments the outcome on
      # the deploy-fallback issue.
      fallback:
        description: "Internal: set by the redeploy fallback (by hand only for the drill)"
        type: boolean
        default: false
      # Forces the hang path on purpose, to exercise the fallback end to end
      # (#131). Every attempt gets a 1 ms timeout and a 1 ms poll interval, so
      # deploy-pages creates the deployment, times out right after its first
      # status poll and cancels it, the state a real hang leaves. (With the
      # default 5s poll interval a healthy deploy, median ~7s, could report
      # success first.) The landed check also ignores a match, which could be
      # an earlier deploy's stamp. Procedure, on main and off-hours (never in
      # the ~46 min before the ESG push at 07:01 Pacific, 14:01 UTC in summer,
      # 15:01 UTC in winter): push an empty commit to main, then dispatch
      # (a) drill + fallback: deploy fails, redeploy and report are skipped,
      # no commit;
      # (b) drill alone: redeploy pushes a commit, opens a deploy-fallback
      # issue, and the dispatched run deploys it and closes the issue.
      drill:
        description: "Drill: force every attempt to time out and exercise the redeploy fallback"
        type: boolean
        default: false

# Least privilege at the top; the deploy job widens to what Pages and its
# superseded check need, the redeploy job to what a commit, a dispatch and an
# issue need, and the report job to issues only.
permissions:
  contents: read

jobs:
  # Build the Jekyll site and hand it off as a Pages artifact.
  build:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    # Observed 4.6-5.7 min over the last 15 runs, so this is ~3.5x headroom, not
    # a value a healthy build approaches. It exists because the default is 6
    # HOURS: on 2026-08-18 `apt-get update` in a sibling workflow stalled against
    # a degraded azure.archive.ubuntu.com mirror and sat there for 47 min looking
    # alive. A hang here is worse than there, because the deploy job below holds
    # the "pages" concurrency group — a stall would queue the next day's 14:01
    # UTC ESG deploy behind it. Fail fast and let the rerun handle it.
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      # A minor series, not a patch pin. On 2026-11-13 `ubuntu-latest` moved to
      # ubuntu-26.04, and setup-ruby builds only the latest patch of each series
      # for newer images, so the inherited upstream pin "3.3.5" 404'd at this step
      # and failed every build. Nothing needs the exact patch: Gemfile.lock has no
      # RUBY VERSION section. Keep broken-links-site.yml on the same series.
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install dependencies 💎
        run: bundle install --jobs 4
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      # No "Update _config.yml" step here on purpose. Upstream al-folio rewrites
      # giscus.repo to ${{ github.repository }} at build time, because the
      # template ships a placeholder and every fork has a different repo name.
      # This repo hardcodes its own name at _config.yml:120, so that step wrote
      # the value that was already there — a no-op.
      #
      # It was removed because it was not free: it pulled a third-party action
      # into the deploy path, and on 2026-08-17 that download 429'd three times
      # against GitHub's action CDN and failed the whole deploy during "Set up
      # job", before any of this workflow's own steps ran. The publish-step
      # retry ladder below cannot help there — it only wraps the Pages publish.
      # That outage missed the 14:01 UTC ESG feed deploy.
      #
      # Tradeoff: renaming or transferring this repo now requires editing
      # giscus.repo by hand. A custom domain does NOT — giscus keys off the
      # repository, not the site URL.
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      # Build stamp: the deploy job's landed check fetches it from the live
      # site to tell whether this commit's build is what Pages serves. The
      # Pages status API cannot tell it: on 2026-11-05 it returned an empty
      # status throughout a hang and after the cancel.
      - name: Stamp the build 🏷️
        run: echo "$GITHUB_SHA" > _site/build-version.txt
      - name: Upload Pages artifact 📦
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Publish the artifact to GitHub Pages, retrying on the same commit first
  # and under a new one only when that fails (#25, #131).
  #
  # Since PR #26 (2026-07-04) the retries engaged on 5 of 207 non-PR runs.
  # One was a create() HTTP 500 that attempt 2 recovered (run 38409795380).
  # Four were hangs: the deployment sat in deployment_queued or updating_pages
  # until the 6-min cap, and the action canceled it. Three recovered at the
  # same commit: runs 30160854989 and 31108716653 on attempt 2 (deploy-pages
  # v4), and 32145772232 on attempt 3 (v5), 60s after attempt 2 read the
  # cancel back as "Deployment cancelled." in seconds. One never did: run
  # 42050610219 on 2026-11-05, nor its rerun 3.5 h later. Pages names a
  # deployment after GITHUB_SHA, and only a new commit deployed it. So:
  #
  # 1. Up to three attempts at this commit, 30s then 60s apart, each capped at
  #    6 min by the action. The cap covers the observed history of healthy
  #    publishes (median ~7s, p95 ~278s, max ~323s over 40 runs, #25), so a
  #    slow-but-healthy deploy succeeds on attempt 1 instead of being killed.
  #    The action allows at most 10 min. It cancels a deployment only on
  #    timeout, after too many status-poll errors, or on a signal. A final
  #    error status such as "Deployment failed, try again later." fails the
  #    step without a cancel.
  # 2. If no attempt succeeded, the landed check: a deployment the action
  #    canceled can still finish, so if the live build-version.txt already
  #    equals this commit the job passes and nothing is redone.
  # 3. Otherwise the job fails, and the redeploy job below gives the same
  #    content a new commit.
  #
  # Time to live, counted from the push: a hang a retry recovers, ~14.5-16.5
  # min (measured 14.5, 16.4 and 16.6 on the three above). A hang like
  # 2026-11-05's, ~25-34 min: the first build (~4-6 min), two attempts to
  # their caps and the third read back canceled (~14.5 min), then redeploy, a
  # second full build of 5-12 min and the publish. Up to ~40 min if all three
  # hang to the cap. Both miss the daily ESG SLA, and that is accepted: the
  # alternative waited on a human, ~4 h on 2026-11-05.
  #
  # Before any attempt, the job skips publishing when the live site already
  # serves a newer commit (#134). The build job sits outside the "pages"
  # group, so builds can finish out of order: push A, then B; B builds faster
  # and publishes, then A would publish over it. The check reads the live
  # build-version.txt and asks the compare API how it relates to this commit.
  # Only "ahead" (the live commit descends from this one, so its tree already
  # has this commit's changes) skips, and the job then succeeds without
  # publishing. Equal, older, diverged, unreadable, an API error or a timeout
  # all publish, as before. A rerun of an old run's deploy job skips too, so
  # a rollback is a revert commit, not a rerun. A drill never skips.
  #
  # The check runs inside the group, so no other in-group publish can land
  # between it and this job's attempts. Three gaps remain. A deployment that
  # an earlier run's attempt canceled can still land late, outside any group
  # (item 2 above). The expected limit is CDN lag: the check runs seconds after the
  # newer publish, may read the older stamp, and then publishes, which is the
  # old behavior. And a newer commit's pending deploy can be replaced in the
  # queue by an older one's and lost (#157). The live stamp, not the
  # github-pages environment's record, says what is served: a skipped job
  # still records its commit as the environment's active deployment.
  deploy:
    needs: build
    # Never deploy from a PR; PRs only validate the build job above.
    # A workflow_dispatch on another branch passes this `if:` but cannot
    # publish: the github-pages environment (Settings -> Environments) allows
    # deployments from `main` only, so the job fails at the environment check.
    # That policy is the guard, not this condition; keep it main-only (#135).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Worst case ~24.3 min: the superseded check to its 1-min step cap, three
    # attempts to their 7-min step caps (21), the 30s and 60s backoffs, and
    # the landed check (under 1 min). That leaves ~1.7 min for job setup
    # inside 26. The step caps are what bound a create() call that hangs,
    # which the action's own timeout does not cover (its clock starts after
    # create() returns). Without them a hung create() would run into this cap,
    # the job would end canceled, and redeploy, which runs only on failure,
    # would not run. Four places depend on this cap: the "~46 min before the
    # ESG push" in the drill comment above and in
    # .github/workflows/repo-stats.yml's schedule comment (a build of up to 20
    # min plus this cap), that comment's "up to its 26-min cap", and the
    # recompute rule in CLAUDE.md's Deploy section. Recompute them all if a
    # cap, a backoff, the landed check or the superseded check changes.
    #
    # Safe despite the concurrency group below: timeout-minutes measures
    # execution time on the runner, not time spent queued waiting for the
    # group, so a deploy held behind another does not burn its budget.
    timeout-minutes: 26
    # Serialize deploys and never cancel an in-flight publish, so a retrying
    # run can't be killed by the next push (and vice versa). Scoped to this
    # job so PR build runs don't share the group. redeploy and report stay out
    # of it: they never publish, and a queued member of the group replaces a
    # pending one, so in the group a redeploy could cancel a newer push's
    # pending deploy, or be canceled by one and lose the fallback.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from this workflow
      # For the superseded check's compare API call. This block replaces the
      # top-level one, so without it the job has no contents scope at all.
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url || steps.newer.outputs.url }}
    steps:
      # The superseded check (#134; see the comment above the job). It must
      # never stop a deploy: it is capped at 1 min, every network call has its
      # own timeout, continue-on-error keeps a failure from skipping the
      # attempts, and the guards below test != 'true', so a step that failed
      # or wrote nothing publishes. It always logs what it read.
      - name: Skip if the site already serves a newer commit ⏭️
        id: newer
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DRILL: ${{ inputs.drill || false }}
        run: |
          # rc 124 is timeout's: a killed gh prints nothing, so say so.
          rc=0
          url=$(timeout 15 gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url) || { rc=$?; url=; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          live=
          if [[ -n $url ]]; then
            live=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${url%/}/build-version.txt?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pre" | tr -d '[:space:]') || live=
          fi
          if [[ -z $url && $rc == 124 ]]; then
            status="no Pages URL (API call timed out)"
          elif [[ -z $url ]]; then
            status="no Pages URL (API call failed)"
          elif [[ ! $live =~ ^[0-9a-f]{40}$ ]]; then
            status="no readable live stamp"
          elif [[ $live == "$GITHUB_SHA" ]]; then
            status=identical
          else
            status=$(timeout 15 gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" --jq .status) || { rc=$?; status=; }
            if [[ -z $status && $rc == 124 ]]; then
              status="compare timed out"
            elif [[ -z $status ]]; then
              status="compare failed"
            fi
          fi
          skip=false
          if [[ $status == ahead && $DRILL != true ]]; then
            skip=true
          fi
          shown=${live:0:40} # a non-SHA stamp is whatever the URL served
          summary="live: ${shown:-none}, this commit: $GITHUB_SHA, compare: $status"
          if [[ $skip == true ]]; then
            echo "::notice::The live site already serves $live, a newer commit than $GITHUB_SHA, so nothing is published ($summary)."
          elif [[ $status == ahead ]]; then
            echo "::notice::Drill: the live site serves a newer commit, but a drill never skips; publishing ($summary)."
          else
            case $status in
              identical | behind | diverged) echo "Publishing ($summary)." ;;
              *) echo "::warning::Superseded check inconclusive; publishing as before ($summary)." ;;
            esac
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Each attempt has a 7-min step cap over the action's 6-min one: the
      # action's poll interval backs off to 30s, so it can overshoot its cap
      # by up to ~30s, and the step cap also bounds a hung create(). A step
      # that hits its cap reports outcome failure (actions/runner
      # StepsRunner.cs RunStepAsync sets TaskResult.Failed on a step timeout;
      # only canceling the job sets Canceled). The conditions also accept
      # cancelled, which is harmless: a run canceled as a whole skips these
      # steps anyway (no always()).
      - name: Deploy to GitHub Pages (attempt 1) 🚀
        id: deploy1
        if: steps.newer.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 7
        uses: actions/deploy-pages@v5
        with:
          timeout: ${{ inputs.drill && 1 || 360000 }} # 6 min (default 10); drill: 1 ms
          reporting_interval: ${{ inputs.drill && 1 || 5000 }} # 5000 is the action's default

      - name: Backoff before attempt 2 ⏳
        if: steps.deploy1.outcome == 'failure' || steps.deploy1.outcome == 'cancelled'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2) 🚀
        id: deploy2
        if: steps.deploy1.outcome == 'failure' || steps.deploy1.outcome == 'cancelled'
        continue-on-error: true
        timeout-minutes: 7
        uses: actions/deploy-pages@v5
        with:
          timeout: ${{ inputs.drill && 1 || 360000 }}
          reporting_interval: ${{ inputs.drill && 1 || 5000 }}

      - name: Backoff before attempt 3 ⏳
        if: steps.deploy2.outcome == 'failure' || steps.deploy2.outcome == 'cancelled'
        run: sleep 60
      - name: Deploy to GitHub Pages (attempt 3) 🚀
        id: deploy3
        if: steps.deploy2.outcome == 'failure' || steps.deploy2.outcome == 'cancelled'
        continue-on-error: true
        timeout-minutes: 7
        uses: actions/deploy-pages@v5
        with:
          timeout: ${{ inputs.drill && 1 || 360000 }}
          reporting_interval: ${{ inputs.drill && 1 || 5000 }}

      # Runs only when no attempt succeeded, and decides the job. Only an exact
      # match with this commit counts as landed. Any other stamp (older,
      # newer, missing or unreadable), or no deployment URL to fetch it from
      # (no attempt's create() returned), means not landed, which costs at most
      # one redundant redeploy and never a missed one. The no-URL case is an
      # accepted exception to "a late landing is never redone" (#131): a
      # create() that hung or errored may still have created a deployment
      # that lands later.
      - name: Check whether the site has this build 🔎
        if: steps.newer.outputs.skip != 'true' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        env:
          PAGE_URL: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
          DRILL: ${{ inputs.drill || false }}
          FALLBACK: ${{ inputs.fallback || false }}
          REF: ${{ github.ref }}
        run: |
          recipe="branch off origin/main, git commit --allow-empty, git push origin HEAD:main, then gh workflow run deploy.yml --ref main (the dispatch is needed: an empty commit does not match the paths filter)"
          if [[ $REF == refs/heads/main && $FALLBACK != true ]]; then
            next="The redeploy job will push an empty commit on top of this one (or, if main has moved, use main's newer head), dispatch a fresh deploy and open a deploy-fallback issue. If it fails: $recipe."
          else
            next="No redeploy runs here (this run is itself the fallback, or not on main). To recover by hand: $recipe."
          fi
          if [[ -z $PAGE_URL ]]; then
            echo "::error::No attempt returned a deployment URL, so the landed check cannot run; treated as not landed (at most one redundant redeploy). $next"
            exit 1
          fi
          for try in 1 2 3; do
            live=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${PAGE_URL%/}/build-version.txt?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${try}" || true)
            if [[ $live == "$GITHUB_SHA" ]]; then
              if [[ $DRILL == true ]]; then
                echo "::error::Drill: the live stamp matches $GITHUB_SHA (likely an earlier deploy of this commit) and is ignored by design, so this is treated as not landed to exercise the fallback. $next"
                exit 1
              fi
              echo "::notice::The live site already serves $GITHUB_SHA (live build-version.txt matches), so nothing is redone."
              exit 0
            fi
            if ((try < 3)); then sleep 10; fi
          done
          echo "::error::The site is not serving $GITHUB_SHA (live build-version.txt: '${live:-unreadable}') after every attempt at this commit failed. $next"
          exit 1

  # The new-identity fallback (#131). It runs when the deploy job failed, on
  # main, and not inside a run that is itself a fallback (the loop guard). The
  # deploy job fails when the landed check found the site without this build,
  # but also when no attempt returned a deployment URL to check (one may still
  # have been created: the accepted AC2 exception above), or on a setup, OIDC
  # or runner failure. Each of those is a new commit and a fresh build a few
  # minutes later, at most once, which would also have recovered the
  # 2026-08-17 setup 429. A failed build skips deploy, so it never gets here:
  # a new commit would rebuild the same broken tree. failure() is needed
  # because a job whose needs failed is otherwise skipped before its if: is
  # read. It also opens the deploy-fallback issue that notifies the owner:
  # the script does on the paths it handles, and the job's last step does
  # whenever the script did not (#136). Details in bin/pages-redeploy.sh.
  redeploy:
    needs: deploy
    if: failure() && needs.deploy.result == 'failure' && github.ref == 'refs/heads/main' && !inputs.fallback
    runs-on: ubuntu-latest
    # One push, up to 40s of dispatch backoff and one issue. It does not wait
    # on the run it dispatches; that run's report job follows up. The step
    # caps (2 + 3 + 1) are what make a hang notify: a step that hits its cap
    # fails (see the superseded check's comment in the deploy job), so the
    # backstop step still runs, where a job-level timeout cancels the job and
    # runs nothing after it. This cap is the steps plus ~1 min of setup, and
    # it only catches a runner or setup hang before any step, which notifies
    # nobody. Nothing else depends on it.
    timeout-minutes: 7
    permissions:
      contents: write # push the empty commit
      actions: write # dispatch deploy.yml
      issues: write # open the deploy-fallback issue
    steps:
      - name: Checkout 🛎️
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          # The failed commit, not main's head: the empty commit must be its
          # child, so the push succeeds only if main has not moved.
          ref: ${{ github.sha }}
      - name: Commit and redeploy under a new identity 🔁
        id: redeploy
        # Healthy worst case ~1.5 min (push, ls-remote, three dispatches with
        # 10s and 30s backoff, one issue).
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          STUCK_SHA: ${{ github.sha }}
          # Written once the script has opened the issue. Same value in the
          # backstop step below; keep the two in step. (runner is not
          # available in job-level env.)
          FALLBACK_SENTINEL: ${{ runner.temp }}/deploy-fallback-notified
        run: bin/pages-redeploy.sh
      # The backstop (#136): open the deploy-fallback issue whenever the script
      # did not, so every redeploy outcome notifies the owner. That covers a
      # failed or timed-out checkout (the script then never runs: outcome
      # skipped), a set -e or set -u abort, the script step's cap, and a green
      # script whose own `gh issue create` failed. !cancelled(), not failure(),
      # is for that last case; a run a human canceled is left alone. It needs
      # no checkout, because the checkout may be what failed, so everything
      # comes in through env. A dispatched fallback run never gets here: the
      # job's if: skips it on inputs.fallback.
      - name: Notify if the redeploy did not 📣
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          STUCK_SHA: ${{ github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          REDEPLOY_OUTCOME: ${{ steps.redeploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml
          FALLBACK_SENTINEL: ${{ runner.temp }}/deploy-fallback-notified
        run: |
          if [[ -e $FALLBACK_SENTINEL ]]; then
            echo "The redeploy script opened the deploy-fallback issue; nothing to do."
            exit 0
          fi
          short=${STUCK_SHA:0:7}
          if [[ $REDEPLOY_OUTCOME == success ]]; then
            title="Pages deploy fallback ran for $short"
            what="The redeploy step succeeded (its log shows what it pushed and dispatched), but it could not open this issue itself."
          else
            title="Pages redeploy fallback failed for $short"
            what="The redeploy fallback itself failed (checkout: $CHECKOUT_OUTCOME, redeploy script: $REDEPLOY_OUTCOME), so the site may still not serve this build, and whether a fresh deploy was dispatched is unknown: check the failed run's log."
          fi
          body="@$OWNER the deploy job for \`$STUCK_SHA\` failed, so the redeploy fallback ran (#131). $what

          - Failed run: $RUN_URL
          - Deploy runs: $DEPLOYS_URL

          If a fallback deploy was dispatched, its report job comments here and closes this issue on success. If nothing follows within ~30 min, compare the live /build-version.txt with main's head. To recover by hand: branch off origin/main, git commit --allow-empty, git push origin HEAD:main, then gh workflow run deploy.yml --ref main (an empty commit does not match deploy.yml's paths filter, so the dispatch is needed)."
          if ! gh issue create --label deploy-fallback --title "$title" --body "$body"; then
            echo "::error::Could not open the deploy-fallback issue here either, so the owner was not notified: $RUN_URL"
            exit 1
          fi

  # Closes the loop on a fallback: in a run redeploy dispatched, comment the
  # deploy job's result on the most recent open deploy-fallback issue, and
  # close the issue on success. "Most recent" has two known gaps, accepted
  # (#136): when one fallback opened two issues (see bin/pages-redeploy.sh),
  # it closes the newer and leaves the older open, a false "may be stale";
  # and when two fallbacks run within ~10 min, the first one's report can
  # close the second one's issue. Key the lookup on the run instead if
  # anything else starts opening deploy-fallback issues. Runs whatever deploy did (always()), but never
  # on a failed build, which skips deploy and would only report "skipped", and
  # never in a drill, whose deploy fails on purpose (drill step (a)).
  report:
    needs: deploy
    if: always() && inputs.fallback && !inputs.drill && github.ref == 'refs/heads/main' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # comment on and close the deploy-fallback issue
    steps:
      - name: Report the fallback deploy on its issue 📣
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --label deploy-fallback --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -z $issue ]]; then
            echo "::notice::No open deploy-fallback issue to report on (a drill, or the issue was closed by hand). Fallback deploy result: $RESULT, $RUN_URL"
            exit 0
          fi
          if [[ $RESULT == success ]]; then
            gh issue comment "$issue" --body "The fallback deploy job succeeded ($RUN_URL): the live site serves $GITHUB_SHA or a newer commit. Closing; reopen to investigate further."
            gh issue close "$issue" --reason completed
          else
            gh issue comment "$issue" --body "The fallback deploy did not succeed (deploy job: $RESULT): $RUN_URL. The site may not be serving this build: compare the live /build-version.txt with main's head before recovering by hand (a newer push's deploy may have replaced this one). To recover by hand: branch off origin/main, git commit --allow-empty, git push origin HEAD:main, then gh workflow run deploy.yml --ref main. If this run's deploy attempts hung or read back a cancel, a same-commit rerun is unlikely to help (it did not on 2026-11-05); if the deploy job failed before its attempts (setup, OIDC), rerun this run."
            echo "::error::The fallback deploy did not succeed (deploy job: $RESULT); commented on deploy-fallback issue #$issue."
          fi
