<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C6FB5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E5A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D3320;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="630" fill="url(#skyGradient)" />

  <!-- Mountain layers - extended landscape version of favicon motif -->
  <!-- Back range -->
  <polygon
    points="0,630 0,420 80,380 200,340 320,360 440,310 560,330 680,280 800,260 920,220 1040,180 1120,140 1200,90 1200,630"
    fill="#1E5A3A"
  />
  <!-- Mid range -->
  <polygon
    points="0,630 0,460 100,420 220,400 340,420 460,370 580,390 700,340 820,320 940,280 1060,240 1140,200 1200,160 1200,630"
    fill="#266848"
    opacity="0.85"
  />
  <!-- Front range -->
  <polygon
    points="0,630 0,500 120,460 240,450 360,470 480,430 600,450 720,400 840,380 950,340 1080,300 1160,260 1200,230 1200,630"
    fill="#2E8B57"
    opacity="0.75"
  />
  <!-- Foreground hills -->
  <polygon
    points="0,630 0,540 140,510 260,500 380,520 480,490 610,510 730,460 840,450 970,400 1070,370 1150,340 1200,310 1200,630"
    fill="#35A065"
    opacity="0.5"
  />

  <!-- Name -->
  <text
    x="600"
    y="180"
    text-anchor="middle"
    font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="64"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="2"
  >
    Frederick Douglas Pearce
  </text>

  <!-- Tagline -->
  <text
    x="600"
    y="240"
    text-anchor="middle"
    font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="300"
    fill="#ffffff"
    fill-opacity="0.85"
    letter-spacing="4"
  >
    FROM ROCKS TO ROWS
  </text>

  <!-- Subtitle -->
  <text
    x="600"
    y="285"
    text-anchor="middle"
    font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="300"
    fill="#ffffff"
    fill-opacity="0.85"
  >
    Machine Learning &#x2022; Data Science &#x2022; Earth Science
  </text>
</svg>
