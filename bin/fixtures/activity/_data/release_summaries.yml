# Fixture for bin/activity-fixture-check.js (not the real override file, which
# is _data/release_summaries.yml). Each entry exercises one rule of the
# Release-branch override lookup in _includes/activity.liquid.

# The derived summary is null: the override still applies.
"fixture-b@v0.6.0": "Override on a release whose derived summary is null"
# Hostile override: rendered escaped, like a derived summary. The markup must
# be well-formed: /activity/ is a Markdown page, and kramdown escapes malformed
# tags itself, which would hide a missing `| escape`.
"fixture-c@v0.3.0": "<i>override</i> & <script>y</script>"
# Empty and whitespace-only overrides fall back to the derived summary.
"fixture-c@v0.2.0": ""
"fixture-c@v0.1.0": "   "
# YAML false (an unquoted no, off or false) falls back to the derived summary
# and never renders the word "false".
"fixture-e@v0.1.0": false
# The release is Fixture-D V1.0.0, and the key is cased differently on both
# halves, so the match needs both sides lowercased.
"FIXTURE-d@V1.0.0": "Override matched case-insensitively"
